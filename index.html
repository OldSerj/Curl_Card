<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 CurlCard - Ultimate Page Reader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>🔗 CurlCard</h1>
                    <span class="tagline">CORS-Proof Page Reader</span>
                </div>
                <div class="header-actions">
                    <button id="toggle-dark" class="toggle-dark" title="Toggle Dark Mode">🌗</button>
                    <a href="https://github.com/OldSerj/Curl_Card" target="_blank" class="github-btn" title="Star on GitHub">⭐</a>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="input-section">
                <div class="input-container">
                    <input type="url" id="url-input" placeholder="Paste any URL (works everywhere!)" />
                    <button id="curl-btn">
                        <span class="btn-text">Curl It</span>
                        <span class="btn-spinner hidden">🌀</span>
                    </button>
                </div>
                <div id="status" class="status hidden"></div>
            </section>

            <section id="preview-section" class="preview-section hidden">
                <div id="preview-card" class="preview-card card"></div>
            </section>

            <section id="reader-section" class="reader-section hidden">
                <div class="reader-container">
                    <div class="reader-header">
                        <button id="back-to-preview" class="back-btn">← Back</button>
                        <div class="reader-meta">
                            <h1 id="reader-title"></h1>
                            <div class="reader-site">
                                <span id="reader-site"></span>
                                <a id="reader-url" class="original-link" target="_blank">🔗 Open Original</a>
                            </div>
                        </div>
                    </div>
                    <div id="reader-content" class="reader-content"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-main">
                    <div class="footer-about">
                        <h3>Made by <a href="https://linktr.ee/oldserj" target="_blank">OldSerj</a></h3>
                        <p>Instant page reading. No tracking. Client-side only.</p>
                    </div>
                    <div class="footer-links">
                        <a href="mailto:sergiugeorgebatrin@gmail.com" class="contact-link">📧 sergiugeorgebatrin@gmail.com</a>
                        <a href="https://github.com/OldSerj" target="_blank" class="contact-link">🐙 GitHub</a>
                        <a href="https://www.instagram.com/sergiubatrin__" target="_blank" class="contact-link">📷 Instagram</a>
                        <a href="https://www.linkedin.com/in/sergiu-batrin-ba56702a8" target="_blank" class="contact-link">💼 LinkedIn</a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <span>🔓 Open Source • <a href="https://github.com/OldSerj/Curl_Card/blob/online/LICENSE" target="_blank">MIT License</a></span>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
